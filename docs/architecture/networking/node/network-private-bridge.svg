<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" width="640" height="264" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="title">Private bridge</title>
  <desc id="desc">Two VMs and a container each connect one interface to a port on the same private bridge. All three interfaces share one isolated layer 2 broadcast domain with no connectivity outside the bridge.</desc>
  <style>
    svg {
      --bg: #fdffff;
      --card: #ffffff;
      --border: #c5c2c3;
      --heading: #071013;
      --line: #7a8b8f;
      --blue: #00a6fb;
      --blue-fill: #e6f5fe;
      --green: #0cce6b;
      --green-fill: #e6faf0;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #071013;
        --card: #13252a;
        --border: #2e4448;
        --heading: #eef3f4;
        --line: #7f9397;
        --blue-fill: #0b2a3a;
        --green-fill: #0b2e22;
      }
    }
    .bg { fill: var(--bg); }
    .core { fill: var(--blue-fill); stroke: var(--blue); stroke-width: 2; }
    .chip { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
    .icon-vm { fill: var(--blue-fill); stroke: var(--blue); stroke-width: 3; }
    .icon-ct { fill: var(--green-fill); stroke: var(--green); stroke-width: 3; }
    .t { fill: var(--heading); font-size: 14px; font-weight: 600; }
    .ic { fill: var(--heading); font-size: 15px; font-weight: 700; }
    .tc { fill: var(--heading); font-size: 12px; font-weight: 600; }
    .ln { fill: none; stroke: var(--line); stroke-width: 2; }
  </style>

  <rect class="bg" x="0" y="0" width="640" height="264" rx="14"/>

  <!-- Private bridge with one port per member interface -->
  <rect class="core" x="32" y="24" width="576" height="44" rx="8"/>
  <text class="t" x="320" y="51" text-anchor="middle">Private bridge</text>
  <rect class="chip" x="122" y="62" width="12" height="12" rx="2"/>
  <rect class="chip" x="314" y="62" width="12" height="12" rx="2"/>
  <rect class="chip" x="506" y="62" width="12" height="12" rx="2"/>

  <!-- dev01 -->
  <line class="ln" x1="128" y1="74" x2="128" y2="112"/>
  <rect class="chip" x="100" y="112" width="56" height="32" rx="6"/>
  <text class="tc" x="128" y="132" text-anchor="middle">gig2</text>
  <line class="ln" x1="128" y1="144" x2="128" y2="168"/>
  <rect class="icon-vm" x="92" y="168" width="72" height="72" rx="14"/>
  <text class="ic" x="128" y="209" text-anchor="middle">VM</text>

  <!-- dev02 -->
  <line class="ln" x1="320" y1="74" x2="320" y2="112"/>
  <rect class="chip" x="292" y="112" width="56" height="32" rx="6"/>
  <text class="tc" x="320" y="132" text-anchor="middle">gig2</text>
  <line class="ln" x1="320" y1="144" x2="320" y2="168"/>
  <rect class="icon-vm" x="284" y="168" width="72" height="72" rx="14"/>
  <text class="ic" x="320" y="209" text-anchor="middle">VM</text>

  <!-- dev03 -->
  <line class="ln" x1="512" y1="74" x2="512" y2="112"/>
  <rect class="chip" x="484" y="112" width="56" height="32" rx="6"/>
  <text class="tc" x="512" y="132" text-anchor="middle">eth1</text>
  <line class="ln" x1="512" y1="144" x2="512" y2="168"/>
  <circle class="icon-ct" cx="512" cy="204" r="36"/>
  <text class="ic" x="512" y="209" text-anchor="middle">CT</text>
</svg>
