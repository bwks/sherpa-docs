<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="title">Point-to-point UDP link (planned)</title>
  <desc id="desc">Two VMs connected eth1 to eth1 by a UDP tunnel. This link type is planned.</desc>
  <style>
    svg {
      --bg: #fdffff;
      --zone: #f3f5f5;
      --card: #ffffff;
      --border: #c5c2c3;
      --heading: #071013;
      --muted: #7a8b8f;
      --line: #7a8b8f;
      --blue: #00a6fb;
      --blue-fill: #e6f5fe;
      --green: #0cce6b;
      --green-fill: #e6faf0;
      --orange: #ed7d3a;
      --orange-fill: #fef4ec;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #071013;
        --zone: #0e1c20;
        --card: #13252a;
        --border: #2e4448;
        --heading: #eef3f4;
        --muted: #7f9397;
        --line: #7f9397;
        --blue-fill: #0b2a3a;
        --green-fill: #0b2e22;
        --orange-fill: #33200f;
      }
    }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--border); stroke-width: 1.5; }
    .chip { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
    .icon-vm { fill: var(--blue-fill); stroke: var(--blue); stroke-width: 3; }
    .icon-ct { fill: var(--green-fill); stroke: var(--green); stroke-width: 3; }
    .ebpf { fill: var(--orange-fill); stroke: var(--orange); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .ic { fill: var(--heading); font-size: 15px; font-weight: 700; }
    .tc { fill: var(--heading); font-size: 12px; font-weight: 600; }
    .h { fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .he { fill: var(--orange); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .ln { fill: none; stroke: var(--line); stroke-width: 2; }
    .dash { stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: var(--orange); stroke-width: 2; }
    .flow-head { fill: var(--orange); }
  </style>

  <rect class="bg" x="0" y="0" width="640" height="200" rx="14"/>

  <rect class="icon-vm" x="24" y="64" width="72" height="72" rx="14"/>
  <text class="ic" x="60" y="105" text-anchor="middle">VM</text>
  <line class="ln" x1="96" y1="100" x2="112" y2="100"/>
  <rect class="chip" x="112" y="84" width="56" height="32" rx="6"/>
  <text class="tc" x="140" y="104" text-anchor="middle">eth1</text>

  <!-- planned link -->
  <line class="ln dash" x1="168" y1="100" x2="472" y2="100"/>
  <text class="h" x="320" y="88" text-anchor="middle">UDP TUNNEL</text>
  <text class="h" x="320" y="124" text-anchor="middle">PLANNED</text>

  <rect class="chip" x="472" y="84" width="56" height="32" rx="6"/>
  <text class="tc" x="500" y="104" text-anchor="middle">eth1</text>
  <line class="ln" x1="528" y1="100" x2="544" y2="100"/>
  <rect class="icon-vm" x="544" y="64" width="72" height="72" rx="14"/>
  <text class="ic" x="580" y="105" text-anchor="middle">VM</text>
</svg>
