<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 642" width="640" height="642" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="title">Sherpa unikernel architecture</title>
  <desc id="desc">sherpad drives libvirtd, which runs one QEMU process per unikernel on the KVM kernel module and the host CPU's virtualisation extensions. A DirectKernel unikernel loads a copy of its kernel ELF from sherpa-pool; a DiskBoot unikernel boots from a copy of its disk image in sherpa-pool. eth0 joins the management network, data interfaces attach to a link bridge or an eBPF tap, and the serial console is telnet on the node's loopback IP port 2323. There is no VNC display.</desc>
  <style>
    svg {
      --bg: #fdffff;
      --zone: #f3f5f5;
      --card: #ffffff;
      --border: #c5c2c3;
      --heading: #071013;
      --muted: #7a8b8f;
      --line: #7a8b8f;
      --blue: #00a6fb;
      --blue-fill: #e6f5fe;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #071013;
        --zone: #0e1c20;
        --card: #13252a;
        --border: #2e4448;
        --heading: #eef3f4;
        --muted: #7f9397;
        --line: #7f9397;
        --blue-fill: #0b2a3a;
      }
    }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--border); stroke-width: 1.5; }
    .box { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
    .core { fill: var(--blue-fill); stroke: var(--blue); stroke-width: 2; }
    .vm { fill: var(--blue-fill); stroke: var(--blue); stroke-width: 1.5; }
    .chip { fill: var(--card); stroke: var(--blue); stroke-width: 1.25; }
    .t { fill: var(--heading); font-size: 14px; font-weight: 600; }
    .tc { fill: var(--heading); font-size: 13px; font-weight: 600; }
    .tl { fill: var(--heading); font-size: 16px; font-weight: 700; }
    .h { fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .ln { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .head { fill: var(--line); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="640" height="642" rx="14"/>

  <rect class="zone" x="16" y="24" width="608" height="602" rx="12"/>
  <text class="h" x="32" y="46">LINUX HOST</text>

  <!-- Control path -->
  <rect class="core" x="32" y="60" width="576" height="40" rx="8"/>
  <text class="t" x="320" y="85" text-anchor="middle">sherpad</text>
  <line class="ln" x1="162" y1="100" x2="162" y2="122" marker-end="url(#arrow)"/>
  <rect class="vm" x="32" y="124" width="576" height="40" rx="8"/>
  <text class="t" x="320" y="149" text-anchor="middle">libvirtd</text>
  <line class="ln" x1="162" y1="164" x2="162" y2="186" marker-end="url(#arrow)"/>

  <!-- QEMU process and its devices -->
  <rect class="vm" x="32" y="188" width="260" height="294" rx="10"/>
  <text class="tl" x="48" y="212">QEMU</text>
  <text class="h" x="108" y="211">ONE PER NODE</text>

  <rect class="chip" x="48" y="224" width="228" height="32" rx="6"/>
  <text class="tc" x="162" y="245" text-anchor="middle">vCPUs · memory</text>
  <rect class="chip" x="48" y="266" width="228" height="32" rx="6"/>
  <text class="tc" x="162" y="287" text-anchor="middle">Kernel · DirectKernel</text>
  <rect class="chip" x="48" y="308" width="228" height="32" rx="6"/>
  <text class="tc" x="162" y="329" text-anchor="middle">Boot disk · DiskBoot</text>
  <rect class="chip" x="48" y="350" width="228" height="32" rx="6"/>
  <text class="tc" x="162" y="371" text-anchor="middle">eth0 · management</text>
  <rect class="chip" x="48" y="392" width="228" height="32" rx="6"/>
  <text class="tc" x="162" y="413" text-anchor="middle">eth1–N · data</text>
  <rect class="chip" x="48" y="434" width="228" height="32" rx="6"/>
  <text class="tc" x="162" y="455" text-anchor="middle">Serial console</text>

  <!-- Host resources backing each device -->
  <text class="h" x="380" y="258">BACKED BY</text>
  <line class="ln" x1="276" y1="282" x2="378" y2="282" marker-end="url(#arrow)"/>
  <rect class="box" x="380" y="266" width="228" height="32" rx="6"/>
  <text class="tc" x="494" y="287" text-anchor="middle">ELF copy in sherpa-pool</text>
  <line class="ln" x1="276" y1="324" x2="378" y2="324" marker-end="url(#arrow)"/>
  <rect class="box" x="380" y="308" width="228" height="32" rx="6"/>
  <text class="tc" x="494" y="329" text-anchor="middle">Disk copy in sherpa-pool</text>
  <line class="ln" x1="276" y1="366" x2="378" y2="366" marker-end="url(#arrow)"/>
  <rect class="box" x="380" y="350" width="228" height="32" rx="6"/>
  <text class="tc" x="494" y="371" text-anchor="middle">Management network</text>
  <line class="ln" x1="276" y1="408" x2="378" y2="408" marker-end="url(#arrow)"/>
  <rect class="box" x="380" y="392" width="228" height="32" rx="6"/>
  <text class="tc" x="494" y="413" text-anchor="middle">Link bridge or eBPF tap</text>
  <line class="ln" x1="276" y1="450" x2="378" y2="450" marker-end="url(#arrow)"/>
  <rect class="box" x="380" y="434" width="228" height="32" rx="6"/>
  <text class="tc" x="494" y="455" text-anchor="middle">Telnet · loopback IP :2323</text>

  <!-- Kernel and hardware -->
  <line class="ln" x1="162" y1="482" x2="162" y2="504" marker-end="url(#arrow)"/>
  <rect class="vm" x="32" y="506" width="576" height="40" rx="8"/>
  <text class="t" x="320" y="531" text-anchor="middle">KVM kernel module</text>
  <line class="ln" x1="162" y1="546" x2="162" y2="568" marker-end="url(#arrow)"/>
  <rect class="box" x="32" y="570" width="576" height="40" rx="8"/>
  <text class="t" x="320" y="595" text-anchor="middle">Host CPU · Intel VT-x / AMD-V</text>
</svg>
