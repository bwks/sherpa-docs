theme:
  name: material
  palette:
    - scheme: latte
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to Frappé

    - scheme: frappe
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to Latte

    # - scheme: macchiato
    #   primary: custom
    #   accent: custom
    #   toggle:
    #     icon: material/weather-partly-cloudy
    #     name: Switch to Mocha

    # - scheme: mocha
    #   primary: custom
    #   accent: custom
    #   toggle:
    #     icon: material/weather-cloudy
    #     name: Switch to Latte
  icon:
    admonition:
      note: fontawesome/solid/lightbulb

extra_css:
  - stylesheets/extra.css
  - stylesheets/table.css
  - stylesheets/image.css

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
