theme:
  name: material
  logo: assets/images/sherpa-icon.svg
  favicon: assets/images/sherpa-icon.svg
  # System fonts, as in the sherpad web UI (no Google Fonts)
  font: false
  # Soda Pop colours from docs/stylesheets/extra.css; follows the OS until toggled
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    admonition:
      note: fontawesome/solid/lightbulb

extra_css:
  - stylesheets/extra.css
  - stylesheets/table.css
  - stylesheets/image.css

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
